<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="csrf-token" content="{{ csrf }}">
  <meta name="theme-color" content="#09090f">
  <title>Seller panel · Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css?v=2">
</head>
<body class="login-body">
  <div class="blobs" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
  <main class="login-wrap">
    <div class="login-card" id="card">
      <div class="logo-badge">🚀</div>
      <h1>Seller panel</h1>
      <p class="muted">Publish your app, get paid on every sale.</p>
      <div class="seg block-seg" id="mode"><button type="button" data-m="login" class="on">Sign in</button><button type="button" data-m="signup">Create account</button></div>
      <div id="err" class="alert" role="alert" hidden></div>
      <form id="form" autocomplete="on" novalidate>
        <label class="field" id="nameRow" hidden><span>Your name</span><input name="name" type="text" maxlength="60" placeholder="Shown to admins only" autocomplete="name"></label>
        <label class="field"><span>Username</span><input name="username" type="text" autocomplete="username" required maxlength="32" placeholder="your username"></label>
        <label class="field"><span>Password</span>
          <div class="pw"><input id="pw" name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="••••••••••">
          <button type="button" id="pwToggle" class="icon-btn" aria-label="Show password">👁</button></div></label>
        <label class="field" id="confirmRow" hidden><span>Confirm password</span><input name="confirm" type="password" autocomplete="new-password" maxlength="128" placeholder="repeat the password"></label>
        <button class="btn primary block" type="submit" id="go">Sign in →</button>
      </form>
      <p class="tiny muted center">Password: 10+ characters with letters and numbers.</p>
    </div>
  </main>
  <script type="module" src="/static/js/seller_auth.js?v=2"></script>
</body>
</html>
