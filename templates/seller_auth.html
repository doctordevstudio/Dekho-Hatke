<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="csrf-token" content="{{ csrf }}">
  <meta name="theme-color" content="#09090f">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/img/icon-192.png">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <title>Seller panel · Dekho Hatke</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css?v=4">
</head>
<body class="login-body" data-home="{{ home }}">
  <div class="blobs" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
  <main class="login-wrap">
    <div class="login-card" id="card">
      <img class="login-logo" src="/static/img/logo-login.jpg" width="168" height="168" alt="Dekho Hatke">
      <h1>Seller panel</h1>
      <p class="muted">Publish your app, get paid on every sale.</p>
      <div class="seller-note">New here? Open our Telegram bot and tap <b>💼 Become Seller</b> — your username and a secure password are created for you instantly.</div>
      <div id="err" class="alert" role="alert" hidden></div>
      <form id="form" autocomplete="on" novalidate>
        <label class="field"><span>Username</span><input name="username" type="text" autocomplete="username" required maxlength="32" placeholder="your username"></label>
        <label class="field"><span>Password</span>
          <div class="pw"><input id="pw" name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="••••••••••">
          <button type="button" id="pwToggle" class="icon-btn" aria-label="Show password">👁</button></div></label>
        <button class="btn primary block" type="submit" id="go">Sign in →</button>
      </form>
      <p class="tiny muted center">Lost your password? Tap <b>Become Seller</b> in the bot again to get a new one.</p>
    </div>
  </main>
  <script type="module" src="/static/js/seller_auth.js?v=4"></script>
</body>
</html>
